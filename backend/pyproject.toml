[tool.poetry]
name = "enterprise-datacatalog-backend"
version = "0.1.0"
description = "Enterprise Data Catalog Backend Core Platform"
authors = ["Enterprise Data Platform Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.16"
fastapi = ">=0.111.0"
sqlalchemy = ">=2.0.30"
alembic = ">=1.13.0"
asyncpg = ">=0.29.0"
psycopg2-binary = ">=2.9.9"
pydantic = ">=2.7.0"
pydantic-settings = ">=2.2.0"
cryptography = ">=42.0.0"
argon2-cffi = ">=23.1.0"
pyjwt = ">=2.8.0"
greenlet = ">=3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0"
pytest-asyncio = ">=0.23.0"
httpx = ">=0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["..", "."]
testpaths = ["tests"]
