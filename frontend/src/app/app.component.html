<div class="app-layout">
  <header class="app-header">
    <div class="header-brand">
      <button class="toggle-btn" (click)="toggleSidebar()" aria-label="Toggle navigation">
        ☰
      </button>
      <span class="brand-title">{{ title() }}</span>
    </div>
    <div class="header-actions">
      <span class="version-badge">v{{ currentVersion() }}</span>
    </div>
  </header>

  <div class="app-body">
    @if (isSidebarOpen()) {
      <aside class="app-sidebar">
        <nav class="nav-menu">
          <a class="nav-item" routerLink="/catalog" routerLinkActive="active" id="nav-catalog">Catalog Search</a>
          <a class="nav-item" routerLink="/connections" routerLinkActive="active" id="nav-connections">Connections</a>
          <a class="nav-item" routerLink="/diff" routerLinkActive="active" id="nav-diff">Version Diff Viewer</a>
          <a class="nav-item" routerLink="/audit" routerLinkActive="active" id="nav-audit">Audit Log Viewer</a>
          <a class="nav-item" routerLink="/reports" routerLinkActive="active" id="nav-reports">Executive Dashboard</a>
        </nav>
      </aside>
    }

    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
